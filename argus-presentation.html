<script>
const documents=["\u003c!doctype html\u003e\n\u003chtml lang=\"en\"\u003e\n\u003chead\u003e\n  \u003cmeta charset=\"utf-8\"\u003e\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\u003e\n  \u003cmeta name=\"theme-color\" content=\"#080c12\"\u003e\n  \u003ctitle\u003eARGUS \u2014 Synthetic Market in 3D\u003c/title\u003e\n  \u003cstyle\u003e\n    :root { color-scheme: dark; --ink:#edf3fa; --muted:#8a9aab; --line:rgba(192,211,232,.15); --cyan:#43d9ee; --amber:#ffb454; --violet:#c69aff; }\n    * { box-sizing:border-box }\n    html,body { width:100%; height:100%; margin:0; overflow:hidden; background:#080c12; color:var(--ink); font:14px/1.4 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,\"Segoe UI\",sans-serif }\n    body { background:radial-gradient(ellipse at 50% 44%,#15212b 0%,#0b1118 42%,#080c12 76%); }\n    #stage { position:fixed; inset:0; }\n    #stage canvas { display:block; width:100%; height:100%; outline:none; }\n    .topbar { position:fixed; z-index:2; top:0; left:0; right:0; display:flex; align-items:center; justify-content:space-between; padding:22px 30px; pointer-events:none; background:linear-gradient(180deg,rgba(8,12,18,.84),rgba(8,12,18,0)); }\n    .brand { display:flex; align-items:center; gap:12px; letter-spacing:.17em; font-size:12px; font-weight:750; }\n    .brand-mark { display:grid; place-items:center; width:31px; height:31px; border:1px solid rgba(67,217,238,.55); color:var(--cyan); transform:rotate(45deg); font-size:15px; }\n    .brand-mark span { transform:rotate(-45deg) }\n    .brand small { color:#8091a3; font-size:10px; font-weight:500; letter-spacing:.14em; margin-left:8px }\n    .live { display:flex; align-items:center; gap:8px; color:#b6c4d0; font-size:11px; letter-spacing:.1em; text-transform:uppercase; }\n    .live i { width:7px; height:7px; display:block; border-radius:50%; background:#5be3a2; box-shadow:0 0 12px #5be3a2; }\n    .intro { display:none; }\n    .eyebrow { color:var(--cyan); text-transform:uppercase; letter-spacing:.22em; font-size:10px; font-weight:700; }\n    h1 { font-size:clamp(25px,3vw,38px); line-height:1.08; letter-spacing:-.04em; margin:10px 0 11px; font-weight:570; }\n    .intro p { color:#9cabb9; font-size:13px; line-height:1.65; margin:0; max-width:315px; }\n    .legend { display:flex; gap:17px; margin-top:18px; color:#a8b5c0; font-size:10px; text-transform:uppercase; letter-spacing:.1em; }\n    .legend span { display:flex; align-items:center; gap:7px; }\n    .dot { width:7px; height:7px; border-radius:50%; display:inline-block }\n    .dot.buy { background:var(--cyan); box-shadow:0 0 9px var(--cyan) }\n    .dot.sell { background:var(--amber); box-shadow:0 0 9px var(--amber) }\n    .dot.sync { background:var(--violet); box-shadow:0 0 9px var(--violet) }\n    .book-card { position:fixed; z-index:2; right:65px; top:112px; width:276px; padding:16px 17px 14px; background:rgba(7,13,20,.9); border:1px solid rgba(192,211,232,.24); border-radius:10px; box-shadow:0 14px 42px rgba(0,0,0,.32); backdrop-filter:blur(14px); }\n    .book-head { display:flex; justify-content:space-between; align-items:center; padding-bottom:11px; border-bottom:1px solid var(--line); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:#c6d2dc; }\n    .book-head span:last-child { color:#6e8193; font-size:9px; letter-spacing:.12em; }\n    .book-columns { display:grid; grid-template-columns:1fr auto 1fr; gap:5px; padding:10px 4px 6px; color:#8da0b0; font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.12em; }\n    .book-columns span:nth-child(2) { text-align:center; color:#d2dce5 }\n    .book-columns span:last-child { text-align:right }\n    .levels { display:flex; flex-direction:column; gap:3px; }\n    .level { position:relative; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:5px; height:22px; padding:0 6px; border-radius:3px; font:12px/1 ui-monospace,SFMono-Regular,Menlo,monospace; overflow:hidden; }\n    .level:before { content:\"\"; position:absolute; z-index:-1; top:0; bottom:0; opacity:.14; }\n    .level.ask:before { right:0; width:var(--depth,30%); background:var(--amber); }\n    .level.bid:before { left:0; width:var(--depth,30%); background:var(--cyan); }\n    .level.spoof { box-shadow:inset 0 0 0 1px rgba(255,86,115,.9),0 0 11px rgba(255,59,91,.18); }\n    .level.spoof:before { background:#ff536f; opacity:.3; }\n    .level.ask .price { color:#ffc783 }\n    .level.bid .price { color:#70e4f2 }\n    .level.spoof .price { color:#ff8b9e; }\n    .level .qty { color:#bac6d0 }\n    .level .side-label { color:#75899a; font-size:9px }\n    .spread { display:flex; justify-content:space-between; align-items:center; padding:11px 7px 10px; border-top:1px solid rgba(192,211,232,.22); border-bottom:1px solid rgba(192,211,232,.22); margin:8px 0; background:rgba(255,255,255,.025); }\n    .spread strong { font:500 20px/1 ui-monospace,SFMono-Regular,Menlo,monospace; color:#f1f6fa; }\n    .spread small { display:block; color:#75899a; font-size:9px; letter-spacing:.12em; text-transform:uppercase; margin-top:4px; }\n    .spread .spread-value { color:#a4b5c3; font:11px/1 ui-monospace,SFMono-Regular,Menlo,monospace; }\n    .depth-foot { display:flex; justify-content:space-between; color:#667a8c; font-size:9px; letter-spacing:.1em; text-transform:uppercase; padding:1px 2px 0; }\n    .spoof-signal { display:flex; align-items:center; gap:8px; margin:10px 0 2px; padding:8px 9px; border:1px solid rgba(255,91,117,.24); border-radius:5px; background:rgba(255,75,101,.055); color:#ca9ba2; font-size:9px; letter-spacing:.04em; }\n    .spoof-signal i { width:7px; height:7px; flex:none; border-radius:50%; background:#ff6078; box-shadow:0 0 8px rgba(255,96,120,.65); }\n    .spoof-signal span { flex:1; }\n    .spoof-signal b { color:#ff8798; font-size:8px; letter-spacing:.12em; }\n    .spoof-signal.active { border-color:rgba(255,91,117,.72); background:rgba(255,75,101,.13); color:#ffd1d8; }\n    .spoof-signal.active i { animation:spoofPulse .75s ease-in-out infinite alternate; }\n    @keyframes spoofPulse { to { transform:scale(1.7); box-shadow:0 0 13px #ff6078; } }\n    .selection { position:fixed; z-index:3; left:30px; bottom:30px; width:260px; min-height:60px; padding:11px 13px; border-left:2px solid var(--cyan); background:linear-gradient(90deg,rgba(13,22,30,.84),rgba(13,22,30,0)); opacity:0; transform:translateY(6px); transition:.2s; pointer-events:none; }\n    .selection.show { opacity:1; transform:none; }\n    .selection strong { display:block; font-size:12px; letter-spacing:.08em; text-transform:uppercase; }\n    .selection small { display:block; color:#91a2b0; font-size:11px; margin-top:4px; }\n    #order-layer { position:fixed; z-index:2; top:68px; left:24px; right:365px; display:grid; grid-template-rows:repeat(2,78px); grid-auto-columns:128px; grid-auto-flow:column; gap:8px; overflow-x:auto; overflow-y:hidden; padding:2px 2px 5px; pointer-events:auto; scrollbar-width:thin; scrollbar-color:#385565 transparent; }\n    #order-layer:empty { visibility:hidden; }\n    .order-card { width:128px; height:78px; padding:6px 7px; border:1px solid var(--order-color); border-radius:6px; background:rgba(8,17,26,.94); color:#edf3fa; }\n    .order-card-head { display:flex; align-items:center; justify-content:space-between; gap:3px; font-size:8px; font-weight:750; letter-spacing:.02em; }\n    .order-side { border-radius:3px; padding:2px 3px; background:var(--order-color); color:#081019; font-size:8px; white-space:nowrap; }\n    .order-price { margin:4px 0 3px; font:600 13px/1.1 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:-.04em; }\n    .order-price small { font:500 8px system-ui; color:#91a6b8; letter-spacing:.03em; }\n    .order-details { display:flex; justify-content:space-between; gap:4px; font-size:8px; color:#aabfce; }\n    .order-status { margin-top:4px; padding-top:3px; border-top:1px solid #ffffff18; color:var(--order-color); font-size:8px; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }\n    .order-card.arrived { background:rgba(13,31,36,.97); }\n    @media(max-width:760px) { #order-layer{top:58px;left:12px;right:12px;grid-template-rows:78px;} }\n    .error { position:fixed; z-index:5; inset:auto 20px 100px; display:none; margin:auto; max-width:600px; padding:13px 16px; background:#251713; border:1px solid #78432f; border-radius:8px; color:#f8c19d; font-size:12px; text-align:center; }\n    @media(max-width:760px) { .topbar{padding:15px 17px}.book-card{top:auto;right:12px;bottom:20px;width:210px;padding:11px}.book-card .level{height:19px;font-size:10px}.book-head{font-size:8px}.book-card .spread strong{font-size:16px}.bottom{padding:10px 15px 13px}.selection{left:18px;bottom:30px}.control-left{gap:6px}.control-right{display:none}.metric{min-width:56px}.hint{display:none}.live{font-size:9px} }\n    @media(max-width:440px) { .brand small{display:none}.intro p{max-width:185px}.legend{flex-direction:column;gap:4px;margin-top:9px}.book-card{bottom:20px;width:166px}.flowline{font-size:10px}.controls{gap:5px}.metric:nth-child(3){display:none}.button{padding:0 8px} }\n  \u003c/style\u003e\n  \u003cscript type=\"importmap\"\u003e\n    {\"imports\":{\"three\":\"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js\",\"three/addons/\":\"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/\"}}\n  \u003c/script\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n  \u003cdiv id=\"stage\" aria-label=\"Interactive three-dimensional synthetic market scene\"\u003e\u003c/div\u003e\n  \u003cdiv id=\"order-layer\" aria-label=\"Orders travelling to the exchange\"\u003e\u003c/div\u003e\n  \u003cheader class=\"topbar\"\u003e\n    \u003cdiv class=\"brand\"\u003e\u003cspan class=\"brand-mark\"\u003e\u003cspan\u003e\u2316\u003c/span\u003e\u003c/span\u003e\u003cspan\u003eARGUS\u003c/span\u003e\u003c/div\u003e\n    \u003cdiv class=\"live\"\u003e\u003ci\u003e\u003c/i\u003e Synthetic exchange \u00b7 live\u003c/div\u003e\n  \u003c/header\u003e\n  \u003caside class=\"book-card\" aria-label=\"Live order book\"\u003e\n    \u003cdiv class=\"book-head\"\u003e\u003cspan\u003eShared order book\u003c/span\u003e\u003cspan\u003eLIMIT \u00b7 FIFO\u003c/span\u003e\u003c/div\u003e\n    \u003cdiv class=\"spoof-signal\" id=\"spoof-signal\"\u003e\u003ci\u003e\u003c/i\u003e\u003cspan id=\"spoof-copy\"\u003eSpoof-like pattern \u00b7 simulation, not proof\u003c/span\u003e\u003cb id=\"spoof-state\"\u003eWATCH\u003c/b\u003e\u003c/div\u003e\n    \u003cdiv class=\"book-columns\"\u003e\u003cspan\u003eBid qty\u003c/span\u003e\u003cspan\u003ePrice \u00b7 USD\u003c/span\u003e\u003cspan\u003eAsk qty\u003c/span\u003e\u003c/div\u003e\n    \u003cdiv class=\"levels\" id=\"asks\"\u003e\u003c/div\u003e\n    \u003cdiv class=\"spread\"\u003e\u003cdiv\u003e\u003cstrong id=\"mid\"\u003e10,000.00\u003c/strong\u003e\u003csmall\u003eMid price \u00b7 USD\u003c/small\u003e\u003c/div\u003e\u003cdiv class=\"spread-value\"\u003e\u003cspan id=\"spread\"\u003e\u2014\u003c/span\u003e\u003csmall\u003eSpread\u003c/small\u003e\u003c/div\u003e\u003c/div\u003e\n    \u003cdiv class=\"levels\" id=\"bids\"\u003e\u003c/div\u003e\n    \u003cdiv class=\"depth-foot\"\u003e\u003cspan id=\"bid-depth\"\u003eBid depth 0\u003c/span\u003e\u003cspan id=\"ask-depth\"\u003eAsk depth 0\u003c/span\u003e\u003c/div\u003e\n  \u003c/aside\u003e\n  \u003cdiv class=\"selection\" id=\"selection\"\u003e\u003cstrong id=\"selected-name\"\u003e\u003c/strong\u003e\u003csmall id=\"selected-role\"\u003e\u003c/small\u003e\u003c/div\u003e\n  \u003cdiv class=\"error\" id=\"error\"\u003e\u003c/div\u003e\n  \u003cscript type=\"module\"\u003e\n    import * as THREE from 'three';\n    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';\n\n    const stage = document.querySelector('#stage');\n    const errorBox = document.querySelector('#error');\n    let renderer;\n    try {\n      renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, powerPreference:'high-performance' });\n    } catch (error) {\n      errorBox.style.display = 'block';\n      errorBox.textContent = 'This 3D presentation needs a browser with WebGL enabled. ' + error.message;\n      throw error;\n    }\n    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));\n    renderer.setSize(innerWidth, innerHeight);\n    renderer.shadowMap.enabled = true;\n    renderer.shadowMap.type = THREE.PCFSoftShadowMap;\n    renderer.outputColorSpace = THREE.SRGBColorSpace;\n    renderer.toneMapping = THREE.ACESFilmicToneMapping;\n    renderer.toneMappingExposure = 1.15;\n    stage.appendChild(renderer.domElement);\n\n    const scene = new THREE.Scene();\n    scene.fog = new THREE.FogExp2(0x0a1017, 0.019);\n    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 150);\n    camera.position.set(22, 20, 27);\n    function frameScene(){\n      camera.aspect=innerWidth/innerHeight;\n      camera.setViewOffset(innerWidth,innerHeight,innerWidth*(innerWidth\u003e760?.10:.04),-innerHeight*(innerWidth\u003e760?.075:.04),innerWidth,innerHeight);\n      camera.updateProjectionMatrix();\n    }\n    frameScene();\n    const controls = new OrbitControls(camera, renderer.domElement);\n    controls.target.set(0, 1.8, 0);\n    controls.enableDamping = true;\n    controls.enableZoom = false;\n    controls.autoRotate = true;\n    controls.autoRotateSpeed = .35;\n    controls.dampingFactor = .055;\n    controls.minDistance = 15;\n    controls.maxDistance = 44;\n    controls.maxPolarAngle = Math.PI * .48;\n    controls.update();\n\n    scene.add(new THREE.HemisphereLight(0xccecff, 0x151b24, 2.1));\n    const keyLight = new THREE.DirectionalLight(0xe0f4ff, 3.2);\n    keyLight.position.set(8, 18, 7); keyLight.castShadow = true; keyLight.shadow.mapSize.set(2048,2048); scene.add(keyLight);\n    const cyanLight = new THREE.PointLight(0x22d5f0, 40, 20, 2); cyanLight.position.set(-6,5,3); scene.add(cyanLight);\n    const ambe n\u003e\n\u003csection class=\"frame final-screen\" aria-label=\"Matrix to AI model to possible outputs\" hidden\u003e\u003cdiv class=\"final-diagram\" aria-label=\"Agent feature matrix to AI model to possible outputs\"\u003e\u003cdiv class=\"diagram\"\u003e\n\u003cdiv class=\"matrix\" id=\"matrix\" role=\"table\" aria-label=\"Illustrative feature matrix: agents in rows and features in columns\"\u003e\u003c/div\u003e\n\u003cdiv class=\"arrow\" aria-label=\"Input to model\"\u003e\u21d2\u003c/div\u003e\n\u003cdiv class=\"model\"\u003e\u003cdiv class=\"symbol\" aria-hidden=\"true\"\u003eAI\u003c/div\u003e\u003ch1\u003eAI Model\u003c/h1\u003e\u003c/div\u003e\n\u003cdiv class=\"arrow\" aria-label=\"Model output\"\u003e\u21d2\u003c/div\u003e\n\u003cdiv class=\"outputs\"\u003e\u003ch2\u003ePOSSIBLE OUTPUTS\u003c/h2\u003e\u003cdiv class=\"output\"\u003eNormal\u003c/div\u003e\u003cdiv class=\"output\"\u003eSpoofing-like\u003c/div\u003e\u003cdiv class=\"output\"\u003eLayering-like\u003c/div\u003e\u003cdiv class=\"output\"\u003eWash-like\u003c/div\u003e\u003c/div\u003e\n\u003c/div\u003e\u003c/div\u003e\n\u003cfooter class=\"model-reference\"\u003e\u003cp\u003eDai, Y., Quinn, B., Kearney, F., Liu, W., Spence, I., Rafferty, K., &amp; Wang, H. (2026). Detecting market manipulation with dual-branch self-supervised learning: A unified framework integrating frequency-informed anomaly synthesis and domain-specific features. \u003cem\u003eInformation Processing &amp; Management, 63\u003c/em\u003e(8), 104961. \u003ca href=\"https://doi.org/10.1016/j.ipm.2026.104961\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ehttps://doi.org/10.1016/j.ipm.2026.104961\u003c/a\u003e\u003c/p\u003e\u003c/footer\u003e\u003c/section\u003e\n\u003csection class=\"frame performance-screen\" aria-label=\"Reference model performance\" hidden\u003e\n\u003cdiv class=\"frame-head\"\u003e\u003cspan\u003e03\u003c/span\u003eMODEL PERFORMANCE \u00b7 REFERENCE STUDY\u003c/div\u003e\n\u003cdiv class=\"performance-heading\"\u003e\u003ch2\u003eDetection quality, at a glance.\u003c/h2\u003e\u003cp\u003eSD-FMM \u00b7 25-Chinese Stock dataset \u00b7 Dai et al. (2026), Tables 2\u20133\u003c/p\u003e\u003c/div\u003e\n\u003cdiv class=\"metrics-grid\"\u003e\u003carticle class=\"metric-card\"\u003e\u003cdiv class=\"metric-top\"\u003e\u003cstrong\u003e77.59%\u003c/strong\u003e\u003c/div\u003e\u003ch3\u003ePrecision\u003c/h3\u003e\u003cp\u003eCorrectness of manipulation alerts\u003c/p\u003e\u003c/article\u003e\u003carticle class=\"metric-card\"\u003e\u003cdiv class=\"metric-top\"\u003e\u003cstrong\u003e42.25%\u003c/strong\u003e\u003c/div\u003e\u003ch3\u003eRecall\u003c/h3\u003e\u003cp\u003eProportion of manipulative time points detected\u003c/p\u003e\u003c/article\u003e\u003carticle class=\"metric-card\"\u003e\u003cdiv class=\"metric-top\"\u003e\u003cstrong\u003e54.71%\u003c/strong\u003e\u003c/div\u003e\u003ch3\u003eF1-score\u003c/h3\u003e\u003cp\u003eBalance between precision and recall\u003c/p\u003e\u003c/article\u003e\u003carticle class=\"metric-card favorable\"\u003e\u003cdiv class=\"metric-top\"\u003e\u003cstrong\u003e1.45%\u003c/strong\u003e\u003cspan class=\"metric-good\"\u003eLOW FALSE ALARMS\u003c/span\u003e\u003c/div\u003e\u003ch3\u003eFalse Alarm Rate\u003c/h3\u003e\u003cp\u003eNormal observations incorrectly flagged\u003c/p\u003e\u003c/article\u003e\u003carticle class=\"metric-card delay\"\u003e\u003cdiv class=\"metric-top\"\u003e\u003cstrong\u003e5.44\u003c/strong\u003e\u003csvg class=\"metric-clock\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" aria-hidden=\"true\"\u003e\u003ccircle cx=\"12\" cy=\"12\" r=\"8.5\"/\u003e\u003cpath d=\"M12 6.5V12l3.5 2\"/\u003e\u003c/svg\u003e\u003c/div\u003e\u003ch3\u003eMean Detection Delay\u003c/h3\u003e\u003cp\u003eReported delay units; lower is better\u003c/p\u003e\u003c/article\u003e\u003carticle class=\"metric-card\"\u003e\u003cdiv class=\"metric-top\"\u003e\u003cstrong\u003e92.55%\u003c/strong\u003e\u003c/div\u003e\u003ch3\u003eAccuracy\u003c/h3\u003e\u003cp\u003eOverall point-level classification accuracy\u003c/p\u003e\u003c/article\u003e\u003c/div\u003e\n\u003csection class=\"threshold-section\" aria-label=\"False alarm versus detection speed tradeoff\"\u003e\u003ch3\u003eFalse Alarm vs. Detection Speed Tradeoff\u003c/h3\u003e\u003cdiv class=\"threshold-panels\"\u003e\n\u003carticle class=\"threshold-panel higher\"\u003e\u003ch4\u003e\u003cspan\u003e\u2191\u003c/span\u003e Higher Detection Threshold\u003c/h4\u003e\u003cul\u003e\u003cli\u003eFewer false alarms\u003c/li\u003e\u003cli\u003ePotentially longer detection delay\u003c/li\u003e\u003cli\u003ePotentially lower recall\u003c/li\u003e\u003c/ul\u003e\u003c/article\u003e\n\u003carticle class=\"threshold-panel lower\"\u003e\u003ch4\u003e\u003cspan\u003e\u2193\u003c/span\u003e Lower Detection Threshold\u003c/h4\u003e\u003cul\u003e\u003cli\u003eMore sensitive detection\u003c/li\u003e\u003cli\u003ePotentially shorter detection delay\u003c/li\u003e\u003cli\u003ePotentially more false alarms\u003c/li\u003e\u003c/ul\u003e\u003c/article\u003e\n\u003c/div\u003e\u003c/section\u003e\n\u003cfooter class=\"performance-source\"\u003e\u003cp\u003eDai, Y., Quinn, B., Kearney, F., Liu, W., Spence, I., Rafferty, K., &amp; Wang, H. (2026). Detecting market manipulation with dual-branch self-supervised learning: A unified framework integrating frequency-informed anomaly synthesis and domain-specific features. \u003cem\u003eInformation Processing &amp; Management, 63\u003c/em\u003e(8), 104961. \u003ca href=\"https://doi.org/10.1016/j.ipm.2026.104961\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ehttps://doi.org/10.1016/j.ipm.2026.104961\u003c/a\u003e\u003c/p\u003e\u003c/footer\u003e\n\u003c/section\u003e\n\u003c/main\u003e\n\n\u003cscript\u003e\nconst agents=['ZEUS','HERA','POSEIDON','HERMES','APATE','ARES','ARTEMIS','APOLLO','ATHENA','HEPHAESTUS'];\nconst features=['Agent','New orders','Cancels','Fills','Live levels','Cancel burst','Spread','Mid \u0394'];\nconst matrix=document.querySelector('#matrix');\nconst cell=(text,cls,role)=\u003e{const el=document.createElement('div');el.className='cell '+cls;el.textContent=text;el.setAttribute('role',role);return el};\nconst header=document.createElement('div');header.style.display='contents';header.setAttribute('role','row');features.forEach(f=\u003eheader.appendChild(cell(f,'head','columnheader')));matrix.appendChild(header);\n// Fixed illustrative feature values; this diagram does not run model inference.\nagents.forEach((name,a)=\u003e{const row=document.createElement('div');row.style.display='contents';row.setAttribute('role','row');row.appendChild(cell(name,'agent','rowheader'));const values=[1+(a+9)%3,(a+9)%2,(a+9)%3===0?1:0,a===7?5:1+(a+9)%3,0,'0.50','1.00'];values.forEach(v=\u003erow.appendChild(cell(v,'value'+(a%2===0?' alt':''),'cell')));matrix.appendChild(row)});\n\n    // One shared synthetic timeline drives the live book and every captured image.\n    const bookTimeline=Array.from({length:11},(_,second)=\u003e{\n      const mid=10000+Math.round(Math.sin(second*.8)*4)*.25;\n      const spread=second%4===3?1:.5;\n      return {second,mid,spread,bids:Array.from({length:5},(_,level)=\u003e({price:mid-spread/2-level*.25,qty:80+(second*31+level*47)%180})),asks:Array.from({length:5},(_,level)=\u003e({price:mid+spread/2+level*.25,qty:75+(second*43+level*37)%175}))};\n    });\n    const priceText=value=\u003evalue.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});\n\n    function depthChart(book,mini=false){\n      const left=65,right=865,top=50,bottom=260;\n      const x=price=\u003eleft+(price-9997.5)/5*(right-left);\n      const y=volume=\u003ebottom-volume/300*(bottom-top);\n      const bid=x(book.bids[0].price),ask=x(book.asks[0].price),mid=x(book.mid);\n      const grid=[0,100,200,300].map(v=\u003e`\u003cline x1=\"${left}\" y1=\"${y(v)}\" x2=\"${right}\" y2=\"${y(v)}\" stroke=\"#243540\"/\u003e\u003ctext x=\"${left-10}\" y=\"${y(v)+4}\" text-anchor=\"end\" fill=\"#8fa7b6\" font-size=\"12\"\u003e${v}\u003c/text\u003e`).join('');\n      const ticks=[9997.5,9998.5,9999.5,10000.5,10001.5,10002.5].map(p=\u003e`\u003ctext x=\"${x(p)}\" y=\"318\" text-anchor=\"middle\" fill=\"#91a8b7\" font-size=\"11\"\u003e${priceText(p)}\u003c/text\u003e`).join('');\n      const bars=[...book.bids.map(o=\u003e({...o,color:'#5ad6e8',side:'Bid'})),...book.asks.map(o=\u003e({...o,color:'#ffb65c',side:'Ask'}))].map(o=\u003e`\u003cg\u003e\u003ctitle\u003e${o.side}: ${priceText(o.price)} USD, ${o.qty} units\u003c/title\u003e\u003crect x=\"${x(o.price)-13}\" y=\"${y(o.qty)}\" width=\"26\" height=\"${bottom-y(o.qty)}\" rx=\"3\" fill=\"${o.color}\" opacity=\".88\"/\u003e${mini?'':`\u003ctext x=\"${x(o.price)}\" y=\"${y(o.qty)-7}\" text-anchor=\"middle\" fill=\"${o.color}\" font-size=\"12\"\u003e${o.qty}\u003c/text\u003e`}\u003c/g\u003e`).join('');\n      return `\u003csvg viewBox=\"0 0 920 355\" role=\"img\" aria-label=\"Order book at ${book.second} seconds. Price on the horizontal axis, volume on the vertical axis. Mid price ${priceText(book.mid)}, spread ${priceText(book.spread)}.\"\u003e\n        \u003ctext x=\"65\" y=\"22\" fill=\"#5ad6e8\" font-size=\"13\"\u003eBIDS \u00b7 BUY\u003c/text\u003e\u003ctext x=\"865\" y=\"22\" text-anchor=\"end\" fill=\"#ffb65c\" font-size=\"13\"\u003eASKS \u00b7 SELL\u003c/text\u003e\n        ${grid}\u003cline x1=\"65\" y1=\"50\" x2=\"65\" y2=\"260\" stroke=\"#7b929f\"/\u003e\u003cline x1=\"65\" y1=\"260\" x2=\"865\" y2=\"260\" stroke=\"#7b929f\"/\u003e\n        \u003crect x=\"${bid}\" y=\"50\" width=\"${ask-bid}\" height=\"210\" fill=\"#c69aff\" opacity=\".045\"/\u003e${bars}\n        \u003cline x1=\"${mid}\" y1=\"38\" x2=\"${mid}\" y2=\"260\" stroke=\"#d5b4ff\" stroke-dasharray=\"4 5\"/\u003e\n        \u003ctext x=\"${mid}\" y=\"25\" text-anchor=\"middle\" fill=\"#e2caff\" font-size=\"14\"\u003eMID ${priceText(book.mid)}\u003c/text\u003e\n        \u003cpath d=\"M ${bid} 270 V 280 H ${ask} V 270 M ${mid} 280 V 286\" fill=\"none\" stroke=\"#d5b4ff\" stroke-width=\"1.5\"/\u003e\n        \u003ctext x=\"${mid}\" y=\"300\" text-anchor=\"middle\" fill=\"#d5b4ff\" font-size=\"11\"\u003eSPREAD ${priceText(book.spread)}\u003c/text\u003e${ticks}\n        \u003ctext x=\"465\" y=\"347\" text-anchor=\"middle\" fill=\"#b1c4d0\" font-size=\"13\"\u003ePRICE \u00b7 USD\u003c/text\u003e\n        \u003ctext transform=\"translate(19 155) rotate(-90)\" text-anchor=\"middle\" fill=\"#b1c4d0\" font-size=\"13\"\u003eVOLUME \u00b7 UNITS\u003c/text\u003e\n      \u003c/svg\u003e`;\n    }\n\n\nconst frames=[...document.querySelectorAll('.frame')];\nframes.forEach((frame,i)=\u003e{frame.hidden=i!==0;frame.classList.toggle('active',i===0)});\ndocument.querySelector('.top small').textContent=0===2?'REFERENCE STUDY':'SIMULATED DATA';\nlet elapsed=0,active=false,last=performance.now(),lastSecond=-1;\nfunction updateBook(){const second=Math.min(10,Math.floor(elapsed/1000));if(second===lastSecond)return;lastSecond=second;const book=bookTimeline[second];document.querySelector('#depth-chart').innerHTML=depthChart(book);document.querySelector('#book-status').textContent=`T+${second}s \u00b7 Mid ${priceText(book.mid)} USD \u00b7 Spread ${priceText(book.spread)} USD`;}\nupdateBook();\naddEventListener('message',event=\u003e{if(event.source===parent&&event.data?.type==='argus-active'){active=event.data.active;last=performance.now()}});\nsetInterval(()=\u003e{const now=performance.now();if(active&&0===0){elapsed+=now-last;updateBook()}last=now},100);\n\u003c/script\u003e\u003cscript\u003e\n(()=\u003e{\n let active=false,startY=null;\n const canScroll=(target,dy)=\u003e{for(let node=target;node&&node!==document;node=node.parentElement){const css=getComputedStyle(node);if(/auto|scroll/.test(css.overflowY)&&node.scrollHeight\u003enode.clientHeight+2&&((dy\u003e0&&node.scrollTop+node.clientHeight\u003cnode.scrollHeight-2)||(dy\u003c0&&node.scrollTop\u003e2)))return true;}return false;};\n addEventListener('message',event=\u003e{if(event.source===parent&&event.data?.type==='argus-active')active=event.data.active});\n addEventListener('wheel',event=\u003e{if(!active||Math.abs(event.deltaX)\u003eMath.abs(event.deltaY)||canScroll(event.target,event.deltaY))return;event.preventDefault();parent.postMessage({type:'argus-wheel',delta:event.deltaY*(event.deltaMode===1?16:1)},'*')},{passive:false});\n addEventListener('touchstart',event=\u003e{startY=event.touches[0]?.clientY},{passive:true});\n addEventListener('touchend',event=\u003e{const y=event.changedTouches[0]?.clientY;if(active&&startY!==null&&Math.abs(startY-y)\u003e65&&!canScroll(event.target,startY-y))parent.postMessage({type:'argus-step',direction:Math.sign(startY-y)},'*');startY=null},{passive:true});\n addEventListener('keydown',event=\u003e{if(event.target.closest('a,button,input,textarea,select'))return;if(['ArrowDown','ArrowUp','PageDown','PageUp'].includes(event.key)){event.preventDefault();parent.postMessage({type:'argus-step',direction:['ArrowDown','PageDown'].includes(event.key)?1:-1},'*')}});\n parent.postMessage({type:'argus-ready'},'*');\n})();\n\u003c/script\u003e\u003c/body\u003e\u003c/html\u003e", "\u003c!doctype html\u003e\n\u003chtml lang=\"en\"\u003e\u003chead\u003e\u003cmeta charset=\"utf-8\"\u003e\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\u003e\u003ctitle\u003eARGUS \u2014 Detection Flow\u003c/title\u003e\u003cstyle\u003e\n*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at center,#15212b,#090d12 75%);color:#eaf1f6;font-family:Inter,system-ui,sans-serif;display:grid;grid-template-rows:1fr auto;justify-items:center;padding:30px}\nmain{align-self:center;width:min(1180px,100%);overflow-x:auto;padding:24px 0}.diagram{display:grid;grid-template-columns:500px 60px 260px 60px 190px;gap:15px;align-items:center;justify-content:center;min-width:1130px}\n.matrix{position:relative;display:grid;g op strong{font-size:37px;font-weight:750;line-height:1.1;letter-spacing:-.045em;font-variant-numeric:tabular-nums;color:#e5f1f9}.metric-card h3{font-size:12px;color:#b7ccda;font-weight:600;margin:9px 0 5px}.metric-card p{font-size:11px;line-height:1.5;color:#859fb1;margin:0}.metric-card.favorable{border-color:#397b67;background:linear-gradient(135deg,#15382e,#10241f)}.favorable .metric-top strong{color:#85e4b7}.metric-good{font-size:8px;letter-spacing:.08em;line-height:1.6;color:#89cdb0;border:1px solid #458269;border-radius:20px;padding:5px 8px;text-align:center}.metric-clock{width:26px;height:26px;color:#8f9fb8;flex:none}.threshold-section{margin-top:22px}.threshold-section\u003eh3{font-size:13px;font-weight:550;color:#c6d7e2;margin:0 0 12px}.threshold-panels{display:grid;grid-template-columns:1fr 1fr;gap:14px}.threshold-panel{border:1px solid #31525b;border-radius:9px;background:#102029;padding:13px 19px}.threshold-panel.lower{border-color:#624c32;background:#231e17}.threshold-panel h4{font-size:12px;font-weight:600;margin:0 0 8px;color:#9bdfeb}.threshold-panel.lower h4{color:#e9bd81}.threshold-panel h4 span{margin-right:7px}.threshold-panel ul{padding-left:17px;margin:0;display:grid;gap:4px;color:#a1b6c5;font-size:11px}.performance-source{font-size:10px;line-height:1.7;color:#8196a7;margin-top:18px;padding:12px 0 6px;border-top:1px solid #263743}.performance-source a{color:#bca6d7;text-decoration:none}.performance-source a:hover{text-decoration:underline}\n@media(max-width:760px){.performance-heading{display:block}.performance-heading p{margin-top:8px}.metric-card{padding:13px}.metric-top strong{font-size:28px}.metric-good{display:none}.metric-card h3{font-size:11px}.metric-card p{font-size:10px}.metrics-grid{gap:8px}.performance-heading h2{font-size:21px}}@media(max-width:480px){.metrics-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.threshold-panels{grid-template-columns:1fr}.metric-top strong{font-size:30px}}\n.performance-source p{margin:0;padding-left:2em;text-indent:-2em}.performance-heading p{max-width:480px;text-align:right;line-height:1.6}@media(max-width:760px){.performance-heading p{text-align:left}}\n.stage{bottom:35px;height:calc(100dvh - 95px)}.frame-head span{display:none}.frame-head{letter-spacing:.12em}.top{padding-right:60px}.performance-heading{flex-wrap:wrap}\n\u003c/style\u003e\u003c/head\u003e\u003cbody\u003e\n\u003cheader class=\"top\"\u003e\u003cstrong\u003e\u2316 ARGUS\u003c/strong\u003e\u003csmall\u003eSIMULATED DATA\u003c/small\u003e\u003c/header\u003e\n\u003cmain class=\"stage\"\u003e\n\u003csection class=\"frame active\" aria-label=\"Order book\"\u003e\u003cdiv class=\"frame-head\"\u003e\u003cspan\u003e01\u003c/span\u003eORDER BOOK\u003c/div\u003e\u003cdiv class=\"screen-content\"\u003e\u003cdiv id=\"depth-chart\" class=\"depth-chart\"\u003e\u003c/div\u003e\u003cdiv id=\"book-status\" class=\"book-status\"\u003e\u003c/div\u003e\u003c/div\u003e\u003c/section\u003e\n\u003csection class=\"frame final-screen\" aria-label=\"Matrix to AI model to possible outputs\" hidden\u003e\u003cdiv class=\"final-diagram\" aria-label=\"Agent feature matrix to AI model to possible outputs\"\u003e\u003cdiv class=\"diagram\"\u003e\n\u003cdiv class=\"matrix\" id=\"matrix\" role=\"table\" aria-label=\"Illustrative feature matrix: agents in rows and features in columns\"\u003e\u003c/div\u003e\n\u003cdiv class=\"arrow\" aria-label=\"Input to model\"\u003e\u21d2\u003c/div\u003e\n\u003cdiv class=\"model\"\u003e\u003cdiv class=\"symbol\" aria-hidden=\"true\"\u003eAI\u003c/div\u003e\u003ch1\u003eAI Model\u003c/h1\u003e\u003c/div\u003e\n\u003cdiv class=\"arrow\" aria-label=\"Model output\"\u003e\u21d2\u003c/div\u003e\n\u003cdiv class=\"outputs\"\u003e\u003ch2\u003ePOSSIBLE OUTPUTS\u003c/h2\u003e\u003cdiv class=\"output\"\u003eNormal\u003c/div\u003e\u003cdiv class=\"output\"\u003eSpoofing-like\u003c/div\u003e\u003cdiv class=\"output\"\u003eLayering-like\u003c/div\u003e\u003cdiv class=\"output\"\u003eWash-like\u003c/div\u003e\u003c/div\u003e\n\u003c/div\u003e\u003c/div\u003e\n\u003cfooter class=\"model-reference\"\u003e\u003cp\u003eDai, Y., Quinn, B., Kearney, F., Liu, W., Spence, I., Rafferty, K., &amp; Wang, H. (2026). Detecting market manipulation with dual-branch self-supervised learning: A unified framework integrating frequency-informed anomaly synthesis and domain-specific features. \u003cem\u003eInformation Processing &amp; Management, 63\u003c/em\u003e(8), 104961. \u003ca href=\"https://doi.org/10.1016/j.ipm.2026.104961\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ehttps://doi.org/10.1016/j.ipm.2026.104961\u003c/a\u003e\u003c/p\u003e\u003c/footer\u003e\u003c/section\u003e\n\u003csection class=\"frame performance-screen\" aria-label=\"Reference model performance\" hidden\u003e\n\u003cdiv class=\"frame-head\"\u003e\u003cspan\u003e03\u003c/span\u003eMODEL PERFORMANCE \u00b7 REFERENCE STUDY\u003c/div\u003e\n\u003cdiv class=\"performance-heading\"\u003e\u003ch2\u003eDetection quality, at a glance.\u003c/h2\u003e\u003cp\u003eSD-FMM \u00b7 25-Chinese Stock dataset \u00b7 Dai et al. (2026), Tables 2\u20133\u003c/p\u003e\u003c/div\u003e\n\u003cdiv class=\"metrics-grid\"\u003e\u003carticle class=\"metric-card\"\u003e\u003cdiv class=\"metric-top\"\u003e\u003cstrong\u003e77.59%\u003c/strong\u003e\u003c/div\u003e\u003ch3\u003ePrecision\u003c/h3\u003e\u003cp\u003eCorrectness of manipulation alerts\u003c/p\u003e\u003c/article\u003e\u003carticle class=\"metric-card\"\u003e\u003cdiv class=\"metric-top\"\u003e\u003cstrong\u003e42.25%\u003c/strong\u003e\u003c/div\u003e\u003ch3\u003eRecall\u003c/h3\u003e\u003cp\u003eProportion of manipulative time points detected\u003c/p\u003e\u003c/article\u003e\u003carticle class=\"metric-card\"\u003e\u003cdiv class=\"metric-top\"\u003e\u003cstrong\u003e54.71%\u003c/strong\u003e\u003c/div\u003e\u003ch3\u003eF1-score\u003c/h3\u003e\u003cp\u003eBalance between precision and recall\u003c/p\u003e\u003c/article\u003e\u003carticle class=\"metric-card favorable\"\u003e\u003cdiv class=\"metric-top\"\u003e\u003cstrong\u003e1.45%\u003c/strong\u003e\u003cspan class=\"metric-good\"\u003eLOW FALSE ALARMS\u003c/span\u003e\u003c/div\u003e\u003ch3\u003eFalse Alarm Rate\u003c/h3\u003e\u003cp\u003eNormal observations incorrectly flagged\u003c/p\u003e\u003c/article\u003e\u003carticle class=\"metric-card delay\"\u003e\u003cdiv class=\"metric-top\"\u003e\u003cstrong\u003e5.44\u003c/strong\u003e\u003csvg class=\"metric-clock\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" aria-hidden=\"true\"\u003e\u003ccircle cx=\"12\" cy=\"12\" r=\"8.5\"/\u003e\u003cpath d=\"M12 6.5V12l3.5 2\"/\u003e\u003c/svg\u003e\u003c/div\u003e\u003ch3\u003eMean Detection Delay\u003c/h3\u003e\u003cp\u003eReported delay units; lower is better\u003c/p\u003e\u003c/article\u003e\u003carticle class=\"metric-card\"\u003e\u003cdiv class=\"metric-top\"\u003e\u003cstrong\u003e92.55%\u003c/strong\u003e\u003c/div\u003e\u003ch3\u003eAccuracy\u003c/h3\u003e\u003cp\u003eOverall point-level classification accuracy\u003c/p\u003e\u003c/article\u003e\u003c/div\u003e\n\u003csection class=\"threshold-section\" aria-label=\"False alarm versus detection speed tradeoff\"\u003e\u003ch3\u003eFalse Alarm vs. Detection Speed Tradeoff\u003c/h3\u003e\u003cdiv class=\"threshold-panels\"\u003e\n\u003carticle class=\"threshold-panel higher\"\u003e\u003ch4\u003e\u003cspan\u003e\u2191\u003c/span\u003e Higher Detection Threshold\u003c/h4\u003e\u003cul\u003e\u003cli\u003eFewer false alarms\u003c/li\u003e\u003cli\u003ePotentially longer detection delay\u003c/li\u003e\u003cli\u003ePotentially lower recall\u003c/li\u003e\u003c/ul\u003e\u003c/article\u003e\n\u003carticle class=\"threshold-panel lower\"\u003e\u003ch4\u003e\u003cspan\u003e\u2193\u003c/span\u003e Lower Detection Threshold\u003c/h4\u003e\u003cul\u003e\u003cli\u003eMore sensitive detection\u003c/li\u003e\u003cli\u003ePotentially shorter detection delay\u003c/li\u003e\u003cli\u003ePotentially more false alarms\u003c/li\u003e\u003c/ul\u003e\u003c/article\u003e\n\u003c/div\u003e\u003c/section\u003e\n\u003cfooter class=\"performance-source\"\u003e\u003cp\u003eDai, Y., Quinn, B., Kearney, F., Liu, W., Spence, I., Rafferty, K., &amp; Wang, H. (2026). Detecting market manipulation with dual-branch self-supervised learning: A unified framework integrating frequency-informed anomaly synthesis and domain-specific features. \u003cem\u003eInformation Processing &amp; Management, 63\u003c/em\u003e(8), 104961. \u003ca href=\"https://doi.org/10.1016/j.ipm.2026.104961\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ehttps://doi.org/10.1016/j.ipm.2026.104961\u003c/a\u003e\u003c/p\u003e\u003c/footer\u003e\n\u003c/section\u003e\n\u003c/main\u003e\n\n\u003cscript\u003e\nconst agents=['ZEUS','HERA','POSEIDON','HERMES','APATE','ARES','ARTEMIS','APOLLO','ATHENA','HEPHAESTUS'];\nconst features=['Agent','New orders','Cancels','Fills','Live levels','Cancel burst','Spread','Mid \u0394'];\nconst matrix=document.querySelector('#matrix');\nconst cell=(text,cls,role)=\u003e{const el=document.createElement('div');el.className='cell '+cls;el.textContent=text;el.setAttribute('role',role);return el};\nconst header=document.createElement('div');header.style.display='contents';header.setAttribute('role','row');features.forEach(f=\u003eheader.appendChild(cell(f,'head','columnheader')));matrix.appendChild(header);\n// Fixed illustrative feature values; this diagram does not run model inference.\nagents.forEach((name,a)=\u003e{const row=document.createElement('div');row.style.display='contents';row.setAttribute('role','row');row.appendChild(cell(name,'agent','rowheader'));const values=[1+(a+9)%3,(a+9)%2,(a+9)%3===0?1:0,a===7?5:1+(a+9)%3,0,'0.50','1.00'];values.forEach(v=\u003erow.appendChild(cell(v,'value'+(a%2===0?' alt':''),'cell')));matrix.appendChild(row)});\n\n    // One shared synthetic timeline drives the live book and every captured image.\n    const bookTimeline=Array.from({length:11},(_,second)=\u003e{\n      const mid=10000+Math.round(Math.sin(second*.8)*4)*.25;\n      const spread=second%4===3?1:.5;\n      return {second,mid,spread,bids:Array.from({length:5},(_,level)=\u003e({price:mid-spread/2-level*.25,qty:80+(second*31+level*47)%180})),asks:Array.from({length:5},(_,level)=\u003e({price:mid+spread/2+level*.25,qty:75+(second*43+level*37)%175}))};\n    });\n    const priceText=value=\u003evalue.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});\n\n    function depthChart(book,mini=false){\n      const left=65,right=865,top=50,bottom=260;\n      const x=price=\u003eleft+(price-9997.5)/5*(right-left);\n      const y=volume=\u003ebottom-volume/300*(bottom-top);\n      const bid=x(book.bids[0].price),ask=x(book.asks[0].price),mid=x(book.mid);\n      const grid=[0,100,200,300].map(v=\u003e`\u003cline x1=\"${left}\" y1=\"${y(v)}\" x2=\"${right}\" y2=\"${y(v)}\" stroke=\"#243540\"/\u003e\u003ctext x=\"${left-10}\" y=\"${y(v)+4}\" text-anchor=\"end\" fill=\"#8fa7b6\" font-size=\"12\"\u003e${v}\u003c/text\u003e`).join('');\n      const ticks=[9997.5,9998.5,9999.5,10000.5,10001.5,10002.5].map(p=\u003e`\u003ctext x=\"${x(p)}\" y=\"318\" text-anchor=\"middle\" fill=\"#91a8b7\" font-size=\"11\"\u003e${priceText(p)}\u003c/text\u003e`).join('');\n      const bars=[...book.bids.map(o=\u003e({...o,color:'#5ad6e8',side:'Bid'})),...book.asks.map(o=\u003e({...o,color:'#ffb65c',side:'Ask'}))].map(o=\u003e`\u003cg\u003e\u003ctitle\u003e${o.side}: ${priceText(o.price)} USD, ${o.qty} units\u003c/title\u003e\u003crect x=\"${x(o.price)-13}\" y=\"${y(o.qty)}\" width=\"26\" height=\"${bottom-y(o.qty)}\" rx=\"3\" fill=\"${o.color}\" opacity=\".88\"/\u003e${mini?'':`\u003ctext x=\"${x(o.price)}\" y=\"${y(o.qty)-7}\" text-anchor=\"middle\" fill=\"${o.color}\" font-size=\"12\"\u003e${o.qty}\u003c/text\u003e`}\u003c/g\u003e`).join('');\n      return `\u003csvg viewBox=\"0 0 920 355\" role=\"img\" aria-label=\"Order book at ${book.second} seconds. Price on the horizontal axis, volume on the vertical axis. Mid price ${priceText(book.mid)}, spread ${priceText(book.spread)}.\"\u003e\n        \u003ctext x=\"65\" y=\"22\" fill=\"#5ad6e8\" font-size=\"13\"\u003eBIDS \u00b7 BUY\u003c/text\u003e\u003ctext x=\"865\" y=\"22\" text-anchor=\"end\" fill=\"#ffb65c\" font-size=\"13\"\u003eASKS \u00b7 SELL\u003c/text\u003e\n        ${grid}\u003cline x1=\"65\" y1=\"50\" x2=\"65\" y2=\"260\" stroke=\"#7b929f\"/\u003e\u003cline x1=\"65\" y1=\"260\" x2=\"865\" y2=\"260\" stroke=\"#7b929f\"/\u003e\n        \u003crect x=\"${bid}\" y=\"50\" width=\"${ask-bid}\" height=\"210\" fill=\"#c69aff\" opacity=\".045\"/\u003e${bars}\n        \u003cline x1=\"${mid}\" y1=\"38\" x2=\"${mid}\" y2=\"260\" stroke=\"#d5b4ff\" stroke-dasharray=\"4 5\"/\u003e\n        \u003ctext x=\"${mid}\" y=\"25\" text-anchor=\"middle\" fill=\"#e2caff\" font-size=\"14\"\u003eMID ${priceText(book.mid)}\u003c/text\u003e\n        \u003cpath d=\"M ${bid} 270 V 280 H ${ask} V 270 M ${mid} 280 V 286\" fill=\"none\" stroke=\"#d5b4ff\" stroke-width=\"1.5\"/\u003e\n        \u003ctext x=\"${mid}\" y=\"300\" text-anchor=\"middle\" fill=\"#d5b4ff\" font-size=\"11\"\u003eSPREAD ${priceText(book.spread)}\u003c/text\u003e${ticks}\n        \u003ctext x=\"465\" y=\"347\" text-anchor=\"middle\" fill=\"#b1c4d0\" font-size=\"13\"\u003ePRICE \u00b7 USD\u003c/text\u003e\n        \u003ctext transform=\"translate(19 155) rotate(-90)\" text-anchor=\"middle\" fill=\"#b1c4d0\" font-size=\"13\"\u003eVOLUME \u00b7 UNITS\u003c/text\u003e\n      \u003c/svg\u003e`;\n    }\n\n\nconst frames=[...document.querySelectorAll('.frame')];\nframes.forEach((frame,i)=\u003e{frame.hidden=i!==1;frame.classList.toggle('active',i===1)});\ndocument.querySelector('.top small').textContent=1===2?'REFERENCE STUDY':'SIMULATED DATA';\nlet elapsed=0,active=false,last=performance.now(),lastSecond=-1;\nfunction updateBook(){const second=Math.min(10,Math.floor(elapsed/1000));if(second===lastSecond)return;lastSecond=second;const book=bookTimeline[second];document.querySelector('#depth-chart').innerHTML=depthChart(book);document.querySelector('#book-status').textContent=`T+${second}s \u00b7 Mid ${priceText(book.mid)} USD \u00b7 Spread ${priceText(book.spread)} USD`;}\nupdateBook();\naddEventListener('message',event=\u003e{if(event.source===parent&&event.data?.type==='argus-active'){active=event.data.active;last=performance.now()}});\nsetInterval(()=\u003e{const now=performance.now();if(active&&1===0){elapsed+=now-last;updateBook()}last=now},100);\n\u003c/script\u003e\u003cscript\u003e\n(()=\u003e{\n let active=false,startY=null;\n const canScroll=(target,dy)=\u003e{for(let node=target;node&&node!==document;node=node.parentElement){const css=getComputedStyle(node);if(/auto|scroll/.test(css.overflowY)&&node.scrollHeight\u003enode.clientHeight+2&&((dy\u003e0&&node.scrollTop+node.clientHeight\u003cnode.scrollHeight-2)||(dy\u003c0&&node.scrollTop\u003e2)))return true;}return false;};\n addEventListener('message',event=\u003e{if(event.source===parent&&event.data?.type==='argus-active')active=event.data.active});\n addEventListener('wheel',event=\u003e{if(!active||Math.abs(event.deltaX)\u003eMath.abs(event.deltaY)||canScroll(event.target,event.deltaY))return;event.preventDefault();parent.postMessage({type:'argus-wheel',delta:event.deltaY*(event.deltaMode===1?16:1)},'*')},{passive:false});\n addEventListener('touchstart',event=\u003e{startY=event.touches[0]?.clientY},{passive:true});\n addEventListener('touchend',event=\u003e{const y=event.changedTouches[0]?.clientY;if(active&&startY!==null&&Math.abs(startY-y)\u003e65&&!canScroll(event.target,startY-y))parent.postMessage({type:'argus-step',direction:Math.sign(startY-y)},'*');startY=null},{passive:true});\n addEventListener('keydown',event=\u003e{if(event.target.closest('a,button,input,textarea,select'))return;if(['ArrowDown','ArrowUp','PageDown','PageUp'].includes(event.key)){event.preventDefault();parent.postMessage({type:'argus-step',direction:['ArrowDown','PageDown'].includes(event.key)?1:-1},'*')}});\n parent.postMessage({type:'argus-ready'},'*');\n})();\n\u003c/script\u003e\u003c/body\u003e\u003c/html\u003e", "\u003c!doctype html\u003e\n\u003chtml lang=\"en\"\u003e\u003chead\u003e\u003cmeta charset=\"utf-8\"\u003e\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\u003e\u003ctitle\u003eARGUS \u2014 Detection Flow\u003c/title\u003e\u003cstyle\u003e\n*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at center,#15212b,#090d12 75%);color:#eaf1f6;font-family:Inter,system-ui,sans-serif;display:grid;grid-template-rows:1fr auto;justify-items:center;padding:30px}\nmain{align-self:center;width:min(1180px,100%);overflow-x:auto;padding:24px 0}.diagram{display:grid;grid-template-columns:500px 60px 260px 60px 190px;gap:15px;align-items:center;justify-content:center;min-width:1130px}\n.matrix{position:relative;display:grid;grid-template-columns:100px repeat(7,1fr);gap:0;padding:16px 12px;background:#10202b;border:1px solid #3b6474;border-radius:8px;font:11px ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}\n.cell{min-height:29px;display:grid;place-items:center;color:#deedf3}.head{font-size:10px;color:#8edeea;line-height:1.35;min-height:42px;text-align:center}.agent{justify-items:start;color:#bbd2df;font-size:10px;padding-left:4px}.value{border-bottom:1px solid #ffffff08}.value.alt{background:#ffffff03}\n.arrow{font-size:51px;color:#c69aff;text-align:center}.model{min-height:300px;border:1px solid #9470b6;border-radius:12px;background:radial-gradient(ellipse at top,#362548,#151723);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 45px #c69aff08}.symbol{width:76px;height:76px;border:1px solid #c69aff;border-radius:19px;background:#c69aff12;display:grid;place-items:center;color:#e6d0ff;font:600 30px ui-monospace,monospace}.model h1{font-size:27px;font-weight:550;margin:22px 0 0}.outputs h2 dden\u003e\u003cdiv class=\"final-diagram\" aria-label=\"Agent feature matrix to AI model to possible outputs\"\u003e\u003cdiv class=\"diagram\"\u003e\n\u003cdiv class=\"matrix\" id=\"matrix\" role=\"table\" aria-label=\"Illustrative feature matrix: agents in rows and features in columns\"\u003e\u003c/div\u003e\n\u003cdiv class=\"arrow\" aria-label=\"Input to model\"\u003e\u21d2\u003c/div\u003e\n\u003cdiv class=\"model\"\u003e\u003cdiv class=\"symbol\" aria-hidden=\"true\"\u003eAI\u003c/div\u003e\u003ch1\u003eAI Model\u003c/h1\u003e\u003c/div\u003e\n\u003cdiv class=\"arrow\" aria-label=\"Model output\"\u003e\u21d2\u003c/div\u003e\n\u003cdiv class=\"outputs\"\u003e\u003ch2\u003ePOSSIBLE OUTPUTS\u003c/h2\u003e\u003cdiv class=\"output\"\u003eNormal\u003c/div\u003e\u003cdiv class=\"output\"\u003eSpoofing-like\u003c/div\u003e\u003cdiv class=\"output\"\u003eLayering-like\u003c/div\u003e\u003cdiv class=\"output\"\u003eWash-like\u003c/div\u003e\u003c/div\u003e\n\u003c/div\u003e\u003c/div\u003e\n\u003cfooter class=\"model-reference\"\u003e\u003cp\u003eDai, Y., Quinn, B., Kearney, F., Liu, W., Spence, I., Rafferty, K., &amp; Wang, H. (2026). Detecting market manipulation with dual-branch self-supervised learning: A unified framework integrating frequency-informed anomaly synthesis and domain-specific features. \u003cem\u003eInformation Processing &amp; Management, 63\u003c/em\u003e(8), 104961. \u003ca href=\"https://doi.org/10.1016/j.ipm.2026.104961\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ehttps://doi.org/10.1016/j.ipm.2026.104961\u003c/a\u003e\u003c/p\u003e\u003c/footer\u003e\u003c/section\u003e\n\u003csection class=\"frame performance-screen\" aria-label=\"Reference model performance\" hidden\u003e\n\u003cdiv class=\"frame-head\"\u003e\u003cspan\u003e03\u003c/span\u003eMODEL PERFORMANCE \u00b7 REFERENCE STUDY\u003c/div\u003e\n\u003cdiv class=\"performance-heading\"\u003e\u003ch2\u003eDetection quality, at a glance.\u003c/h2\u003e\u003cp\u003eSD-FMM \u00b7 25-Chinese Stock dataset \u00b7 Dai et al. (2026), Tables 2\u20133\u003c/p\u003e\u003c/div\u003e\n\u003cdiv class=\"metrics-grid\"\u003e\u003carticle class=\"metric-card\"\u003e\u003cdiv class=\"metric-top\"\u003e\u003cstrong\u003e77.59%\u003c/strong\u003e\u003c/div\u003e\u003ch3\u003ePrecision\u003c/h3\u003e\u003cp\u003eCorrectness of manipulation alerts\u003c/p\u003e\u003c/article\u003e\u003carticle class=\"metric-card\"\u003e\u003cdiv class=\"metric-top\"\u003e\u003cstrong\u003e42.25%\u003c/strong\u003e\u003c/div\u003e\u003ch3\u003eRecall\u003c/h3\u003e\u003cp\u003eProportion of manipulative time points detected\u003c/p\u003e\u003c/article\u003e\u003carticle class=\"metric-card\"\u003e\u003cdiv class=\"metric-top\"\u003e\u003cstrong\u003e54.71%\u003c/strong\u003e\u003c/div\u003e\u003ch3\u003eF1-score\u003c/h3\u003e\u003cp\u003eBalance between precision and recall\u003c/p\u003e\u003c/article\u003e\u003carticle class=\"metric-card favorable\"\u003e\u003cdiv class=\"metric-top\"\u003e\u003cstrong\u003e1.45%\u003c/strong\u003e\u003cspan class=\"metric-good\"\u003eLOW FALSE ALARMS\u003c/span\u003e\u003c/div\u003e\u003ch3\u003eFalse Alarm Rate\u003c/h3\u003e\u003cp\u003eNormal observations incorrectly flagged\u003c/p\u003e\u003c/article\u003e\u003carticle class=\"metric-card delay\"\u003e\u003cdiv class=\"metric-top\"\u003e\u003cstrong\u003e5.44\u003c/strong\u003e\u003csvg class=\"metric-clock\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" aria-hidden=\"true\"\u003e\u003ccircle cx=\"12\" cy=\"12\" r=\"8.5\"/\u003e\u003cpath d=\"M12 6.5V12l3.5 2\"/\u003e\u003c/svg\u003e\u003c/div\u003e\u003ch3\u003eMean Detection Delay\u003c/h3\u003e\u003cp\u003eReported delay units; lower is better\u003c/p\u003e\u003c/article\u003e\u003carticle class=\"metric-card\"\u003e\u003cdiv class=\"metric-top\"\u003e\u003cstrong\u003e92.55%\u003c/strong\u003e\u003c/div\u003e\u003ch3\u003eAccuracy\u003c/h3\u003e\u003cp\u003eOverall point-level classification accuracy\u003c/p\u003e\u003c/article\u003e\u003c/div\u003e\n\u003csection class=\"threshold-section\" aria-label=\"False alarm versus detection speed tradeoff\"\u003e\u003ch3\u003eFalse Alarm vs. Detection Speed Tradeoff\u003c/h3\u003e\u003cdiv class=\"threshold-panels\"\u003e\n\u003carticle class=\"threshold-panel higher\"\u003e\u003ch4\u003e\u003cspan\u003e\u2191\u003c/span\u003e Higher Detection Threshold\u003c/h4\u003e\u003cul\u003e\u003cli\u003eFewer false alarms\u003c/li\u003e\u003cli\u003ePotentially longer detection delay\u003c/li\u003e\u003cli\u003ePotentially lower recall\u003c/li\u003e\u003c/ul\u003e\u003c/article\u003e\n\u003carticle class=\"threshold-panel lower\"\u003e\u003ch4\u003e\u003cspan\u003e\u2193\u003c/span\u003e Lower Detection Threshold\u003c/h4\u003e\u003cul\u003e\u003cli\u003eMore sensitive detection\u003c/li\u003e\u003cli\u003ePotentially shorter detection delay\u003c/li\u003e\u003cli\u003ePotentially more false alarms\u003c/li\u003e\u003c/ul\u003e\u003c/article\u003e\n\u003c/div\u003e\u003c/section\u003e\n\u003cfooter class=\"performance-source\"\u003e\u003cp\u003eDai, Y., Quinn, B., Kearney, F., Liu, W., Spence, I., Rafferty, K., &amp; Wang, H. (2026). Detecting market manipulation with dual-branch self-supervised learning: A unified framework integrating frequency-informed anomaly synthesis and domain-specific features. \u003cem\u003eInformation Processing &amp; Management, 63\u003c/em\u003e(8), 104961. \u003ca href=\"https://doi.org/10.1016/j.ipm.2026.104961\" target=\"_blank\" rel=\"noopener noreferrer\"\u003ehttps://doi.org/10.1016/j.ipm.2026.104961\u003c/a\u003e\u003c/p\u003e\u003c/footer\u003e\n\u003c/section\u003e\n\u003c/main\u003e\n\n\u003cscript\u003e\nconst agents=['ZEUS','HERA','POSEIDON','HERMES','APATE','ARES','ARTEMIS','APOLLO','ATHENA','HEPHAESTUS'];\nconst features=['Agent','New orders','Cancels','Fills','Live levels','Cancel burst','Spread','Mid \u0394'];\nconst matrix=document.querySelector('#matrix');\nconst cell=(text,cls,role)=\u003e{const el=document.createElement('div');el.className='cell '+cls;el.textContent=text;el.setAttribute('role',role);return el};\nconst header=document.createElement('div');header.style.display='contents';header.setAttribute('role','row');features.forEach(f=\u003eheader.appendChild(cell(f,'head','columnheader')));matrix.appendChild(header);\n// Fixed illustrative feature values; this diagram does not run model inference.\nagents.forEach((name,a)=\u003e{const row=document.createElement('div');row.style.display='contents';row.setAttribute('role','row');row.appendChild(cell(name,'agent','rowheader'));const values=[1+(a+9)%3,(a+9)%2,(a+9)%3===0?1:0,a===7?5:1+(a+9)%3,0,'0.50','1.00'];values.forEach(v=\u003erow.appendChild(cell(v,'value'+(a%2===0?' alt':''),'cell')));matrix.appendChild(row)});\n\n    // One shared synthetic timeline drives the live book and every captured image.\n    const bookTimeline=Array.from({length:11},(_,second)=\u003e{\n      const mid=10000+Math.round(Math.sin(second*.8)*4)*.25;\n      const spread=second%4===3?1:.5;\n      return {second,mid,spread,bids:Array.from({length:5},(_,level)=\u003e({price:mid-spread/2-level*.25,qty:80+(second*31+level*47)%180})),asks:Array.from({length:5},(_,level)=\u003e({price:mid+spread/2+level*.25,qty:75+(second*43+level*37)%175}))};\n    });\n    const priceText=value=\u003evalue.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});\n\n    function depthChart(book,mini=false){\n      const left=65,right=865,top=50,bottom=260;\n      const x=price=\u003eleft+(price-9997.5)/5*(right-left);\n      const y=volume=\u003ebottom-volume/300*(bottom-top);\n      const bid=x(book.bids[0].price),ask=x(book.asks[0].price),mid=x(book.mid);\n      const grid=[0,100,200,300].map(v=\u003e`\u003cline x1=\"${left}\" y1=\"${y(v)}\" x2=\"${right}\" y2=\"${y(v)}\" stroke=\"#243540\"/\u003e\u003ctext x=\"${left-10}\" y=\"${y(v)+4}\" text-anchor=\"end\" fill=\"#8fa7b6\" font-size=\"12\"\u003e${v}\u003c/text\u003e`).join('');\n      const ticks=[9997.5,9998.5,9999.5,10000.5,10001.5,10002.5].map(p=\u003e`\u003ctext x=\"${x(p)}\" y=\"318\" text-anchor=\"middle\" fill=\"#91a8b7\" font-size=\"11\"\u003e${priceText(p)}\u003c/text\u003e`).join('');\n      const bars=[...book.bids.map(o=\u003e({...o,color:'#5ad6e8',side:'Bid'})),...book.asks.map(o=\u003e({...o,color:'#ffb65c',side:'Ask'}))].map(o=\u003e`\u003cg\u003e\u003ctitle\u003e${o.side}: ${priceText(o.price)} USD, ${o.qty} units\u003c/title\u003e\u003crect x=\"${x(o.price)-13}\" y=\"${y(o.qty)}\" width=\"26\" height=\"${bottom-y(o.qty)}\" rx=\"3\" fill=\"${o.color}\" opacity=\".88\"/\u003e${mini?'':`\u003ctext x=\"${x(o.price)}\" y=\"${y(o.qty)-7}\" text-anchor=\"middle\" fill=\"${o.color}\" font-size=\"12\"\u003e${o.qty}\u003c/text\u003e`}\u003c/g\u003e`).join('');\n      return `\u003csvg viewBox=\"0 0 920 355\" role=\"img\" aria-label=\"Order book at ${book.second} seconds. Price on the horizontal axis, volume on the vertical axis. Mid price ${priceText(book.mid)}, spread ${priceText(book.spread)}.\"\u003e\n        \u003ctext x=\"65\" y=\"22\" fill=\"#5ad6e8\" font-size=\"13\"\u003eBIDS \u00b7 BUY\u003c/text\u003e\u003ctext x=\"865\" y=\"22\" text-anchor=\"end\" fill=\"#ffb65c\" font-size=\"13\"\u003eASKS \u00b7 SELL\u003c/text\u003e\n        ${grid}\u003cline x1=\"65\" y1=\"50\" x2=\"65\" y2=\"260\" stroke=\"#7b929f\"/\u003e\u003cline x1=\"65\" y1=\"260\" x2=\"865\" y2=\"260\" stroke=\"#7b929f\"/\u003e\n        \u003crect x=\"${bid}\" y=\"50\" width=\"${ask-bid}\" height=\"210\" fill=\"#c69aff\" opacity=\".045\"/\u003e${bars}\n        \u003cline x1=\"${mid}\" y1=\"38\" x2=\"${mid}\" y2=\"260\" stroke=\"#d5b4ff\" stroke-dasharray=\"4 5\"/\u003e\n        \u003ctext x=\"${mid}\" y=\"25\" text-anchor=\"middle\" fill=\"#e2caff\" font-size=\"14\"\u003eMID ${priceText(book.mid)}\u003c/text\u003e\n        \u003cpath d=\"M ${bid} 270 V 280 H ${ask} V 270 M ${mid} 280 V 286\" fill=\"none\" stroke=\"#d5b4ff\" stroke-width=\"1.5\"/\u003e\n        \u003ctext x=\"${mid}\" y=\"300\" text-anchor=\"middle\" fill=\"#d5b4ff\" font-size=\"11\"\u003eSPREAD ${priceText(book.spread)}\u003c/text\u003e${ticks}\n        \u003ctext x=\"465\" y=\"347\" text-anchor=\"middle\" fill=\"#b1c4d0\" font-size=\"13\"\u003ePRICE \u00b7 USD\u003c/text\u003e\n        \u003ctext transform=\"translate(19 155) rotate(-90)\" text-anchor=\"middle\" fill=\"#b1c4d0\" font-size=\"13\"\u003eVOLUME \u00b7 UNITS\u003c/text\u003e\n      \u003c/svg\u003e`;\n    }\n\n\nconst frames=[...document.querySelectorAll('.frame')];\nframes.forEach((frame,i)=\u003e{frame.hidden=i!==2;frame.classList.toggle('active',i===2)});\ndocument.querySelector('.top small').textContent=2===2?'REFERENCE STUDY':'SIMULATED DATA';\nlet elapsed=0,active=false,last=performance.now(),lastSecond=-1;\nfunction updateBook(){const second=Math.min(10,Math.floor(elapsed/1000));if(second===lastSecond)return;lastSecond=second;const book=bookTimeline[second];document.querySelector('#depth-chart').innerHTML=depthChart(book);document.querySelector('#book-status').textContent=`T+${second}s \u00b7 Mid ${priceText(book.mid)} USD \u00b7 Spread ${priceText(book.spread)} USD`;}\nupdateBook();\naddEventListener('message',event=\u003e{if(event.source===parent&&event.data?.type==='argus-active'){active=event.data.active;last=performance.now()}});\nsetInterval(()=\u003e{const now=performance.now();if(active&&2===0){elapsed+=now-last;updateBook()}last=now},100);\n\u003c/script\u003e\u003cscript\u003e\n(()=\u003e{\n let active=false,startY=null;\n const canScroll=(target,dy)=\u003e{for(let node=target;node&&node!==document;node=node.parentElement){const css=getComputedStyle(node);if(/auto|scroll/.test(css.overflowY)&&node.scrollHeight\u003enode.clientHeight+2&&((dy\u003e0&&node.scrollTop+node.clientHeight\u003cnode.scrollHeight-2)||(dy\u003c0&&node.scrollTop\u003e2)))return true;}return false;};\n addEventListener('message',event=\u003e{if(event.source===parent&&event.data?.type==='argus-active')active=event.data.active});\n addEventListener('wheel',event=\u003e{if(!active||Math.abs(event.deltaX)\u003eMath.abs(event.deltaY)||canScroll(event.target,event.deltaY))return;event.preventDefault();parent.postMessage({type:'argus-wheel',delta:event.deltaY*(event.deltaMode===1?16:1)},'*')},{passive:false});\n addEventListener('touchstart',event=\u003e{startY=event.touches[0]?.clientY},{passive:true});\n addEventListener('touchend',event=\u003e{const y=event.changedTouches[0]?.clientY;if(active&&startY!==null&&Math.abs(startY-y)\u003e65&&!canScroll(event.target,startY-y))parent.postMessage({type:'argus-step',direction:Math.sign(startY-y)},'*');startY=null},{passive:true});\n addEventListener('keydown',event=\u003e{if(event.target.closest('a,button,input,textarea,select'))return;if(['ArrowDown','ArrowUp','PageDown','PageUp'].includes(event.key)){event.preventDefault();parent.postMessage({type:'argus-step',direction:['ArrowDown','PageDown'].includes(event.key)?1:-1},'*')}});\n parent.postMessage({type:'argus-ready'},'*');\n})();\n\u003c/script\u003e\u003c/body\u003e\u003c/html\u003e"];
const pages=[...document.querySelectorAll('.page')],frames=pages.map(page=>page.querySelector('iframe'));
const labels=['Synthetic market','Order book','AI model','Model performance'];let current=0,lastMove=0,accumulated=0,lastWheel=0;
function activate(index){current=index;pages.forEach((page,i)=>{page.classList.toggle('active',i===index);frames[i].contentWindow?.postMessage({type:'argus-active',active:i===index},'*')});[...document.querySelector('.page-nav').children].forEach((button,i)=>button.setAttribute('aria-current',i===index?'step':'false'));document.querySelector('.scroll-hint').classList.toggle('last',index===pages.length-1);}
function go(index){index=Math.max(0,Math.min(pages.length-1,index));if(index===current)return;lastMove=performance.now();accumulated=0;pages[index].scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'});}
labels.forEach((label,i)=>{const button=document.createElement('button');button.setAttribute('aria-label',`Go to ${label}`);button.title=label;button.addEventListener('click',()=>go(i));document.querySelector('.page-nav').appendChild(button)});
addEventListener('message',event=>{const index=frames.findIndex(frame=>frame.contentWindow===event.source);if(index<0)return;const data=event.data;if(data?.type==='argus-ready'){event.source.postMessage({type:'argus-active',active:index===current},'*');return}if(index!==current)return;const now=performance.now();if(now-lastMove<950)return;if(data?.type==='argus-step'){go(current+Math.sign(data.direction));return}if(data?.type==='argus-wheel'&&Number.isFinite(data.delta)){if(now-lastWheel>220)accumulated=0;lastWheel=now;accumulated+=data.delta;if(Math.abs(accumulated)>45)go(current+Math.sign(accumulated));}});
const observer=new IntersectionObserver(entries=>{for(const entry of entries)if(entry.isIntersecting&&entry.intersectionRatio>.55)activate(pages.indexOf(entry.target));},{threshold:.55});pages.forEach(page=>observer.observe(page));
addEventListener('keydown',event=>{if(event.target.closest('button,a'))return;if(['ArrowDown','PageDown','ArrowUp','PageUp'].includes(event.key)){event.preventDefault();go(current+(['ArrowDown','PageDown'].includes(event.key)?1:-1));}});
frames.forEach((frame,i)=>{frame.srcdoc=documents[i]});activate(0);
</script></body></html>
