# Banque Horizon : toutes les valeurs chiffrées de la simulation.
# Ce sont des valeurs de départ : on les ajuste ici, jamais dans le code.

seed: 42

clock:
  tick_seconds: 1.0        # durée réelle d'un tick à accélérateur 1
  accelerator: 1.0         # 2.0 = deux fois plus vite
  ticks_per_day: 300       # 1 journée simulée ≈ 5 min

redis:
  url: redis://127.0.0.1:6379/0
  prefix: ""               # "A:" / "B:" en mode comparaison

runs_dir: runs

bank:
  name: Banque Horizon
  capital_eur: 100000000
  # Positions de départ par trader et par actif (en €, au prix initial).
  initial_position_per_trader_eur: 2000000

market:
  assets: [ACME, BOREAL, CITRA]
  initial_price: 100.0
  noise_pct: 0.5                 # bruit uniforme ±0,5 % par tick
  impact_bps_per_meur: 50        # 5 M€ vendus font baisser le prix de 2,5 %
  impact_half_life_ticks: 30     # l'impact de marché se résorbe progressivement
  news:
    probability_per_tick: 0.02   # vraies news générées par la graine
    shock_pct: [0.5, 1.5]        # amplitude du choc ; le signe suit le ton de la news
    confidential_probability: 0.0  # part de news confidentielles (délit d'initié possible)

risk_metrics:
  var_confidence: 0.99
  var_window_ticks: 50
  var_horizon_ticks: 300         # « 1 jour » = ticks_per_day ; mise à l'échelle racine du temps

services:
  market-feed:     {port: 8101, php_version: "7.4", patchable: false, owner_team: "Market Data", criticite: haute, version: "3.2.0"}
  news-wire:       {port: 8102, php_version: "8.1", patchable: true,  owner_team: "Research",    criticite: moyenne, version: "1.8.4"}
  kyc-docs:        {port: 8103, php_version: "8.0", patchable: true,  owner_team: "Conformité",  criticite: haute, version: "2.0.1"}
  payment-gateway: {port: 8104, php_version: "7.4", patchable: false, owner_team: "Paiements",   criticite: critique, version: "5.1.3"}
  core-ledger:     {port: 8105, php_version: "5.6", patchable: false, owner_team: "Back-office", criticite: critique, version: "0.9.7"}

chaos:
  slow_latency_ms: 2500          # latence en mode slow
  client_timeout_ms: 1500        # délai d'attente des agents
  market_feed_drift_pct: -3.0    # BOREAL dérive de -3 % par tick en mode compromised
  market_feed_target: BOREAL
  news_fake_schedule: [1, 6, 12] # ticks après compromission : rumeur, faillite, injection
  payment_substitution_threshold_eur: 500000
  attacker_iban: "FR76 9999 0000 0000 6666 6666 666"
  core_ledger_inflation: 1.15
  kyc_trap_beneficiary: BEN-07
  announce_compromised: false    # true: service_status shows "compromised" on the bus (an attacker would not)

agents:
  quant:
    depends_on: [market-feed]
    fair_window_ticks: 20
    vol_window_ticks: 50
    max_data_age_ticks: 5
    jump_threshold_pct: 20
    low_confidence: 0.3
  trader:
    count: 3
    profiles: [momentum, value, news]
    depends_on: [news-wire]          # payment-gateway est appelé mais NON déclaré
    max_order_eur: 5000000
    max_position_eur: 20000000
    max_daily_loss_eur: 2000000
    min_confidence: 0.5
    signal_threshold: 0.5
    cooldown_ticks: 10
    momentum_window_ticks: 10
    momentum_scale_pct: 4.0          # rendement qui donne un signal de 1
    value_scale_pct: 3.0
    news_memory_ticks: 30            # durée de vie du sentiment d'une news
    news_weight: {momentum: 0.5, value: 0.3, news: 1.0}
    herding: 0.3                     # poids des décisions des pairs (0 à 1)
    herding_window_ticks: 12        # doit dépasser cooldown_ticks pour que les pairs se voient
  compliance:
    depends_on: [kyc-docs]
    restricted_list: []
    structuring_max_orders: 5
    structuring_window_ticks: 10
    small_order_eur: 500000
    spoofing_max_cancels: 3
    spoofing_window_ticks: 10
    wash_window_ticks: 3
    high_risk_countries: [PA, KY, VG, KP, IR]
  risk:
    depends_on: [core-ledger]
    max_exposure_eur: 60000000
    max_var_eur: 3000000
    var_warning_ratio: 0.8           # à 80 % de la VaR max, limites des traders divisées par 2
    var_warning_scale: 0.5
    max_daily_loss_eur: 2000000
    min_cash_eur: 40000000           # coussin de liquidité vérifié sur les soldes de core-ledger
    var_z: 2.326
  payment:
    depends_on: [payment-gateway, core-ledger]
    max_transfer_eur: 1000000
    max_daily_eur: 10000000
    iban_change_lock_ticks: 300      # 24 h simulées
    invoice_every_ticks: 20
    invoice_amount_eur: [150000, 950000]
  executor:
    depends_on: [payment-gateway]

beneficiaries:
  - {id: BEN-01, name: "Atelier Lumen SAS", country: FR, iban: "FR76 3000 1000 0100 0000 0101 101", docs_complete: true}
  - {id: BEN-02, name: "Nordhavn Logistics AB", country: SE, iban: "SE45 5000 0000 0583 9825 7466", docs_complete: true}
  - {id: BEN-03, name: "Ferro Componenti SpA", country: IT, iban: "IT60 X054 2811 1010 0000 0123 456", docs_complete: true}
  - {id: BEN-04, name: "Datapuls GmbH", country: DE, iban: "DE89 3704 0044 0532 0130 00", docs_complete: true}
  - {id: BEN-05, name: "Cabinet Orée Conseil", country: FR, iban: "FR76 1027 8060 6100 0102 0480 101", docs_complete: true}
  - {id: BEN-06, name: "Brightwater Facilities Ltd", country: IE, iban: "IE29 AIBK 9311 5212 3456 78", docs_complete: true}
  - {id: BEN-07, name: "Nimbus Holdings Offshore Ltd", country: VG, iban: "VG96 VPVG 0000 0123 4567 8901", docs_complete: false}

vigie:
  enabled: true
  heartbeat_timeout_ticks: 5         # sans heartbeat Vigie pendant N ticks : ORANGE local
  stub: true                         # profil historique des tests ; make run force false
  orange_amount_factor: 0.5

gate:
  impl: stub                         # tests historiques ; make run génère le profil bus/reject
  timeout_s: 2.0
  default_on_timeout: reject         # BusGate : décision si la Vigie ne répond pas

llm:
  enabled: false                     # aucune API payante ; les lanceurs Vigie imposent aussi false
  guardrails: "off"                  # on | off
  model: claude-opus-5-5             # ANTHROPIC_MODEL dans .env prime
  effort: low                        # jugements courts, un tick dure 1 s
  temperature: null                  # non envoyée : refusée par l'API depuis la version 2026-10-21
  max_tokens: 4000                   # inclut la réflexion du modèle
  timeout_s: 30
  cache: true
  cache_path: runs/llm_cache.jsonl
  min_ticks_between_calls: 2

api:
  port: 8000

cve_feed: inventory/cve_feed.json
