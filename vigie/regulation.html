<!doctype html>

<head>
<meta charset="utf-8">

<title>Régulation · Argus</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 11 8' shape-rendering='crispEdges'%3E%3Crect x='5' y='0' width='1' height='1' fill='%23A8C8FF'/%3E%3Crect x='0' y='1' width='2' height='1' fill='%236AA6FF'/%3E%3Crect x='4' y='1' width='3' height='1' fill='%236AA6FF'/%3E%3Crect x='9' y='1' width='2' height='1' fill='%236AA6FF'/%3E%3Crect x='5' y='2' width='1' height='1' fill='%232B6BFF'/%3E%3Crect x='4' y='3' width='3' height='1' fill='%231446C8'/%3E%3Crect x='4' y='4' width='3' height='1' fill='%230B2A6F'/%3E%3Crect x='3' y='5' width='5' height='2' fill='%230B2A6F'/%3E%3Crect x='2' y='7' width='7' height='1' fill='%23081B45'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/console/static/tokens.css">
<style>
  /* L'espace Régulation, provisoire : la page Sentinel du collègue (détection d'abus de marché) sous un menu simple.
     L'onglet Conformité et l'en-tête commun arrivent avec la page définitive. */
  * { box-sizing: border-box; }
  html { color-scheme: light; }
  body { margin: 0; font: 14px/1.5 var(--sans); color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased; }
  ::selection { background: var(--b2); }
  .menu { position: sticky; top: 0; z-index: 20; height: var(--menu); display: flex; justify-content: center; border-bottom: 1px solid var(--line); background: var(--bg); }
  .brand { position: absolute; left: 20px; top: 0; height: 100%; display: flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none; font: 500 17px var(--sans); letter-spacing: -.03em; }
  .brand svg { width: 26px; height: 19px; }
  .spaces { display: flex; gap: 2px; }
  .spaces a { display: flex; align-items: center; padding: 0 14px; font-size: 14.5px; color: var(--dim); text-decoration: none; border-bottom: 2px solid transparent; }
  .spaces a:hover, .spaces a[aria-current] { color: var(--text); }
  .spaces a[aria-current] { font-weight: 500; border-bottom-color: var(--blue); }
  :focus-visible { outline: 3px solid rgb(31 91 255 / .35); outline-offset: 2px; }
  .colleague-page iframe { display: block; width: 100%; height: calc(100vh - var(--menu)); border: 0; background: var(--surface); }
  @media (max-width: 760px) { .menu { justify-content: flex-end; } .brand span { display: none; } }
</style>
</head>
<body>
<nav class="menu" aria-label="Espaces d'Argus">
  <a class="brand" href="/" aria-label="Argus, page de présentation"><svg viewBox="0 0 11 8" shape-rendering="crispEdges" aria-hidden="true"><rect x="5" y="0" width="1" height="1" fill="#A8C8FF"/><rect x="0" y="1" width="2" height="1" fill="#6AA6FF"/><rect x="4" y="1" width="3" height="1" fill="#6AA6FF"/><rect x="9" y="1" width="2" height="1" fill="#6AA6FF"/><rect x="5" y="2" width="1" height="1" fill="#2B6BFF"/><rect x="4" y="3" width="3" height="1" fill="#1446C8"/><rect x="4" y="4" width="3" height="1" fill="#0B2A6F"/><rect x="3" y="5" width="5" height="2" fill="#0B2A6F"/><rect x="2" y="7" width="7" height="1" fill="#081B45"/></svg><span>Argus</span></a>
  <div class="spaces"><a href="/simulation">Simulation</a><a href="/console">Console</a><a href="/regulation" aria-current="page">Régulation</a></div>
</nav>
<main>
  <section id="marche" class="colleague-page" data-src="/pages/sentinel" aria-label="Marché : Sentinel, la détection d'abus de marché"></section>
</main>
<script src="/console/colleague-pages.js"></script>
</body>
</html>
