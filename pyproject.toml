[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "argus"
version = "0.1.0"
description = "ARGUS surveillance platform"
requires-python = ">=3.11"
dependencies = ["sentinel==0.1.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
argus = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "networkx>=3.3", "httpx>=0.27", "python-dotenv>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["argus*"]

[tool.pytest.ini_options]
pythonpath = ["src", "vendor/sentinel/src"]
testpaths = ["vendor/sentinel/tests"]
markers = ["slow: long-running scale tests"]
addopts = "-m 'not slow'"
