[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel"
version = "0.1.0"
description = "Trade surveillance engine for spoofing, layering and wash trading"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "pandas>=2.2", "pyarrow>=15", "scikit-learn>=1.4", "lightgbm>=4.3", "shap>=0.45", "tabulate>=0.9", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
argus = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "networkx>=3.3", "httpx>=0.27", "python-dotenv>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: long-running scale tests, run with `pytest -m slow`"]
addopts = "-m 'not slow'"
